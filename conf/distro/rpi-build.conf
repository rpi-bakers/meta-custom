require conf/distro/poky.conf

DISTRO = "rpi-build"

DISTRO_FEATURES:append = " opengl pam systemd"

# tk is required for python3-tkinter(GUI library)
PACKAGECONFIG:append:pn-python3 = "tk"

###############################################################################
# base-files.bb: poky\meta\recipes-core\base-files
# Keep /var/log persistent on the rootfs (do not symlink to /var/volatile/log).
# VOLATILE_LOG_DIR is available before Yocto Project Scarthgap.
# If Yocto Project Styhead is used, FILESYSTEM_PERMS_TABLES is available.
VOLATILE_LOG_DIR = "no"

###############################################################################
# wifi settings
DISTRO_FEATURES:append = " wifi"

###############################################################################
# Set PID 1 init system to systemd
VIRTUAL-RUNTIME:init_manager = "systemd"
VIRTUAL-RUNTIME:initscripts = ""
INIT_MANAGER = "systemd"

###############################################################################
# raspberry pi config parameters
# meta-raspberrypi\recipes-bsp\bootfiles\rpi-config_git.bb
# meta-raspberrypi\recipes-bsp\bootfiles\rpi-cmdline.bb
ENABLE_UART = "1"
DISABLE_RPI_BOOT_LOGO = "1"
CMDLINE:append = " splash plymouth.ignore-serial-consoles console=tty1"

###############################################################################
# rpi-config.bbappend parameters
# meta-custom\recipes-bsp\rpi-config\rpi-config_git.bbappend
ENABLE_NVME = "1"

###############################################################################
## use u-boot on raspberry pi
ENABLE_UART = "1"
RPI_USE_U_BOOT = "1"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot"

###############################################################################
# Bundle initramfs
INITRAMFS_IMAGE = "core-image-minimal-initramfs"
INITRAMFS_IMAGE_BUNDLE = "0"
BOOT_SPACE = "1073741"
INITRAMFS_MAXSIZE = "315400"
IMAGE_FSTYPES_pn-${INITRAMFS_IMAGE} = "${INITRAMFS_FSTYPES}"

# fallbackto shell in the initramfs
INITRAMFS_SCRIPTS = "\
                      initramfs-framework-base \
                      initramfs-module-debug \
 "
CMDLINE_DEBUG = "debug shell"

#IMAGE_BOOT_FILES = "${BOOTFILES_DIR_NAME}/* \
#                 ${@make_dtb_boot_files(d)} \
#               ${KERNEL_IMAGETYPE}-${INITRAMFS_LINK_NAME}.bin;${SDIMG_KERNELIMAGE} \
#"

###############################################################################
# FIT image support
KERNEL_IMAGETYPES = " fitImage"
KERNEL_CLASSES += "kernel-fitimage"

KERNEL_IMAGETYPE_UBOOT = "fitImage"
