require conf/distro/rpi-build.conf

DISTRO = "rpi3-ramfs"

###############################################################################
# raspberry pi config parameters
# meta-raspberrypi\recipes-bsp\bootfiles\rpi-config_git.bb
# meta-raspberrypi\recipes-bsp\bootfiles\rpi-cmdline.bb
CMDLINE:remove = " console=tty1"

# SD-card rootfs is not used as the final root.
# The FIT ramdisk is intended to remain as the root filesystem.
CMDLINE_ROOTFS = ""

###############################################################################
## Initramfs for FIT Image
INITRAMFS_IMAGE = "core-image-initramfs-rpi3"
INITRAMFS_FSTYPES = "cpio.gz"
IMAGE_BOOT_FILES:append = " fitImage-${INITRAMFS_IMAGE}-${MACHINE}-${MACHINE};fitImage"
